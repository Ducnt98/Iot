# MQTT TCP for ESP32
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSocket for phone browsers
listener 9001 0.0.0.0
protocol websockets

# LAN demo with password authentication. Do not expose publicly.
allow_anonymous false
password_file C:/mosquitto/auth/passwords.txt

persistence true
persistence_location C:/mosquitto/data/
log_dest stdout
