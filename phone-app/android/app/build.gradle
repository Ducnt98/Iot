plugins {
    id "com.android.application"
}

android {
    namespace "com.example.iot.supportphone"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.iot.supportphone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Java MQTT client; no Android background service required for foreground use.
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
}
